name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Byte-compile source (catches syntax errors early)
        run: python -m compileall -q app tests scripts migrations
      - name: Run deterministic test suite
        run: python -m pytest -v -p no:cacheprovider -m "not integration"

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: ruff check
        run: python -m ruff check .
      - name: mypy
        run: python -m mypy app

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: taskmesh
          POSTGRES_USER: taskmesh
          POSTGRES_PASSWORD: taskmesh_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskmesh -d taskmesh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TASKMESH_DATABASE_URL: postgresql+psycopg://taskmesh:taskmesh_ci_password@localhost:5432/taskmesh
      TASKMESH_CELERY_BROKER_URL: redis://localhost:6379/0
      # Short lease in CI: nothing here runs long enough to need the 300s
      # production default, and a shorter value keeps any future
      # lease-expiry-dependent integration test fast.
      TASKMESH_TASK_LEASE_SECONDS: "20"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Apply migrations to PostgreSQL
        run: python -m alembic upgrade head
      - name: "Start Celery workers (mirrors docker-compose: one dedicated worker per queue)"
        run: |
          mkdir -p /tmp/taskmesh-logs
          nohup python -m celery -A app.workers.celery_app.celery_app worker -Q high --loglevel=info --hostname=worker-high@%h > /tmp/taskmesh-logs/worker-high.log 2>&1 &
          nohup python -m celery -A app.workers.celery_app.celery_app worker -Q medium --loglevel=info --hostname=worker-medium@%h > /tmp/taskmesh-logs/worker-medium.log 2>&1 &
          nohup python -m celery -A app.workers.celery_app.celery_app worker -Q low --loglevel=info --hostname=worker-low@%h > /tmp/taskmesh-logs/worker-low.log 2>&1 &
          nohup python -m celery -A app.workers.celery_app.celery_app worker -Q control --loglevel=info --hostname=worker-control@%h > /tmp/taskmesh-logs/worker-control.log 2>&1 &
          disown -a
      - name: Start API server
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/taskmesh-logs/uvicorn.log 2>&1 &
          disown -a
      - name: Run integration suite against real PostgreSQL + Redis + Celery
        run: python -m pytest tests/integration -v -p no:cacheprovider -m integration
      - name: Load test against the real 4-worker stack
        run: |
          python -m scripts.load_test --tasks 200 --concurrency 20 --base-url http://127.0.0.1:8000 \
            | tee /tmp/taskmesh-logs/load-test-result.json
          python -c "
          import json
          with open('/tmp/taskmesh-logs/load-test-result.json') as f:
              result = json.load(f)
          attempted = result['requests_attempted']
          successful = result['successful_submissions']
          print(f'load test: {successful}/{attempted} submissions succeeded')
          assert successful == attempted, f'load test had failed submissions: {result}'
          "
      - name: Show service logs
        if: always()
        run: |
          for f in /tmp/taskmesh-logs/*.log; do
            echo "=== $f ==="
            cat "$f" || true
            echo
          done
